# Publishes @supa-media/* packages to npmjs.com (public).
#
# On push to main, builds every dist-shipping package and runs
# `changeset publish`. Per-package `publishConfig.registry` points at
# https://registry.npmjs.org, and NPM_TOKEN (via NODE_AUTH_TOKEN +
# registry-url) authorizes the publish. The three values must agree — if
# registry-url and publishConfig disagree, npm authenticates against one
# registry and publishes to the other, and the error names neither.
#
# This was GitHub Packages, which requires a token even for packages marked
# public: an unauthenticated GET of @supa-media/core returned 401. That forced
# a read:packages token into every consumer's CI, into EAS Build, and onto
# every contributor's machine — so nobody could install an MIT repo without
# credentials. npmjs needs no token to read, and that whole layer is gone.
#
# Run manually via the Actions tab (workflow_dispatch) or automatically on
# push to main. No-ops when there are no pending changesets.

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
          scope: "@supa-media"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          # GITHUB_TOKEN still authorizes the release PR / tags; only the
          # registry auth moves to npm.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
