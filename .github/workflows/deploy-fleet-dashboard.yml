name: Deploy Fleet Dashboard

on:
  push:
    branches: [main]
    paths:
      - "packages/fleet-dashboard/**"
      - ".github/workflows/deploy-fleet-dashboard.yml"

concurrency:
  group: deploy-fleet-dashboard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @supa-media/fleet-dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @supa-media/fleet-dashboard build
      - run: npx --yes wrangler@latest pages deploy packages/fleet-dashboard/dist --project-name supa-fleet --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
